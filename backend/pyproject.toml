[project]
name = "wordflow"
version = "0.1.0"
description = "Local, private dictation backend for WordFlow"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "spylls>=0.1.7",
]

[project.optional-dependencies]
# The real speech-to-text models. Heavy, Apple Silicon only. Needed for the
# [pipeline] tier at phase boundaries and in the installed app, never for the
# fast gate, which injects a fake engine.
models = [
    "parakeet-mlx>=0.2",
    "mlx-whisper>=0.4",
    "huggingface-hub>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # FastAPI's TestClient runs on it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wordflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pipeline: slow tests that run the real MLX speech models; phase boundaries only, on the reference machine",
    "manual: placeholders for the written hardware checklist run by a person; always skipped",
]
addopts = "-ra"
